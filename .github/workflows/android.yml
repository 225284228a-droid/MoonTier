name: Android build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 ndk;27.2.12479018 cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # Optional release signing. Without these secrets Gradle falls back to the
      # debug key, so the release APK is still installable.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Signing secrets not set; release APK falls back to the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > ci-release.keystore
          {
            echo "storeFile=ci-release.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build and test
        run: gradle --no-daemon test assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$apk" "dist/moontier-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          ls -l dist
          sha256sum dist/*.apk

      # archive: false uploads the APK as-is, so it downloads as a plain .apk
      # instead of being wrapped in a zip. The artifact takes the file name.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.apk
          archive: false
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "MoonTier $GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/*.apk --clobber

      - name: Remove signing material
        if: always()
        run: rm -f ci-release.keystore keystore.properties
