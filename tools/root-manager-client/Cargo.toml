[package]
name = "moontier-root-manager"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
easytier = { git = "https://github.com/EasyTier/EasyTier.git", rev = "5af90471bfe654d097f7e488a2699f2850db7dd2", default-features = false, features = ["zstd"] }
easytier-core = { git = "https://github.com/EasyTier/EasyTier.git", rev = "5af90471bfe654d097f7e488a2699f2850db7dd2", default-features = false, features = ["management"] }
easytier-proto = { git = "https://github.com/EasyTier/EasyTier.git", rev = "5af90471bfe654d097f7e488a2699f2850db7dd2", default-features = false, features = ["json-rpc"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"
uuid = "1"

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
strip = true
